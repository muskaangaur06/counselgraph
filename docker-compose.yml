services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal_graphrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-legal_graphrag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_graphrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-this-password}
    ports:
      - "7474:7474"  # browser UI
      - "7687:7687"  # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Note: the app uses Chroma in embedded/PersistentClient mode (a local on-disk
  # store, see resources.py), not the Chroma server's HTTP API. There is no
  # separate `chroma` container to run; chroma_data below is a named volume
  # mounted straight into the api container at its on-disk Chroma path instead,
  # so vector data persists across container recreation the same way Postgres/
  # Neo4j/MinIO do.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-legal_graphrag}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-change-this-password}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma_db
      - uploads_data:/app/data/uploads
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-legal_graphrag}:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/${POSTGRES_DB:-legal_graphrag}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-this-password}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-legal_graphrag}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-change-this-password}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-legal-documents}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  chroma_data:
  minio_data:
  uploads_data:
